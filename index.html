<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Warning</title>
    <style>
        body { 
            background: linear-gradient(135deg, #1c0a13 0%, #3d1428 100%);
            color: #ffffff; 
            text-align: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .prelander-box {
            background: rgba(30, 15, 22, 0.6);
            border: none; 
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.15);
            backdrop-filter: blur(12px);
            animation: fadeIn 1s ease-in-out;
        }
        .icon-18 {
            font-size: 55px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.6);
        }
        .title {
            color: #ff69b4; 
            font-size: 24px;
            font-weight: 800;
            margin: 10px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
        }
        .desc {
            color: #fbcfe8; 
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .desc strong {
            color: #ffffff;
        }
        .btn-yes {
            background: linear-gradient(90deg, #ff69b4 0%, #ff1493 100%);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            animation: pulse 1.5s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 105, 180, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 105, 180, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 105, 180, 0.3); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .live-badge {
            display: inline-block;
            background: #ff69b4;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            animation: blink 1.5s infinite;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }
        @keyframes blink {
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="prelander-box">
        <div class="live-badge">💖 LIVE NOW</div>
        <div class="icon-18">🔞</div>
        <h2 class="title">AGE WARNING!</h2>
        <p class="desc">
            This private group contains <strong>adult photos & videos</strong>. Members in your area are waiting.<br><br>Are you over 18 years old?
        </p>
        <a id="action-btn" class="btn-yes" href="https://www.instagram.com/veronicaaleya4" target="_blank" rel="noopener noreferrer">
            <span>🔥</span> YES, I AM 18+ (ENTER)
        </a>
    </div>

    <script>
        // Fungsi untuk mendeteksi apakah pengunjung menggunakan HP atau PC
        function getTargetUrl() {
            let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            let originalUrl = "https://www.instagram.com/veronicaaleya4";
            
            // Jika di HP, gunakan trik Google Redirect agar terbuka di browser web, jika di PC langsung link asli
            if (isMobile) {
                return "https://www.google.com/url?q=" + encodeURIComponent(originalUrl);
            } else {
                return originalUrl;
            }
        }

        // Terapkan link otomatis ke tombol berdasarkan perangkat saat halaman dimuat
        document.getElementById("action-btn").href = getTargetUrl();

        // Redirect otomatis setelah 3 detik menyesuaikan perangkat
        setTimeout(function() {
            window.location.href = getTargetUrl();
        }, 3000);
    </script>
</body>
</html>
