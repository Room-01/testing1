<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🟢Hello! 👋 I'm looking for someone fun to chat with. Maybe that's you? Send me a message here! 😘💌</title>
    <meta content="Naughty fun waiting for you… click here!" name="description" />
    <meta content="Naughty fun waiting for you… click here!" name="og:description" />
    <meta content="https://s13.gifyu.com/images/bnhcn.jpg" property="og:image" />
    <meta content="https://s13.gifyu.com/images/bnhcn.jpg" property="og:image:secure_url" />

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cam Room</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#000;overflow:hidden;color:#fff;}

video{
  position:absolute;
  width:110%;
  height:110%;
  object-fit:cover;
  transform:scale(1);
  transition:transform 8s linear;
}

.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0.2));
}

.top{position:absolute;top:15px;left:15px;}
.live{color:red;font-weight:bold;animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0.3;}}

.stats{font-size:14px;}
.watch{font-size:13px;}

.chat-box{
  position:absolute;
  left:10px;
  bottom:140px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.chat{
  background:rgba(0,0,0,0.6);
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
}

/* BUTTONS */
.buttons{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:85%;
  max-width:320px;
  z-index:10;
}

.btn{
  display:block;
  padding:14px;
  margin:10px 0;
  border-radius:30px;
  text-align:center;
  text-decoration:none;
  color:#fff;
  font-weight:bold;
  transition:0.2s;
}

/* WARNA KHAS */
.wa{background:#25D366;}
.telegram{background:#0088cc;}
.snap{background:#FFFC00;color:#000;}
.tiktok{background:#000;border:1px solid #fff;}

/* HOVER + GLOW */
.btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px rgba(255,255,255,0.6);
}

/* CLICK EFFECT */
.btn:active{
  transform:scale(0.92);
  animation:shake 0.2s;
}

@keyframes shake{
  0%{transform:translateX(0);} 
  25%{transform:translateX(-2px);} 
  50%{transform:translateX(2px);} 
  75%{transform:translateX(-2px);} 
  100%{transform:translateX(0);} 
}

/* EMOJI */
.emoji{
  position:absolute;
  bottom:0;
  font-size:22px;
  animation:rise 4s linear forwards;
}

@keyframes rise{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-700px);opacity:0;}
}

/* GIFT */
.gift{
  position:absolute;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  animation:giftUp 3s linear forwards;
}

@keyframes giftUp{
  0%{transform:translate(-50%,0);opacity:1;}
  100%{transform:translate(-50%,-400px);opacity:0;}
}

/* NOTIF */
.notif{
  position:absolute;
  top:70px;
  right:10px;
  background:rgba(0,0,0,0.7);
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
}
</style>
</head>

<body>

<!-- VIDEO LOKAL -->
<video id="v1" autoplay muted loop playsinline>
  <source src="video1.mp4" type="video/mp4">
</video>

<video id="v2" muted loop playsinline style="display:none;">
  <source src="video2.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="top">
  <h3>🔴 <span class="live">LIVE</span> Private Room</h3>
  <div class="stats">128,934 Members • 48,221 Online</div>
  <div class="watch">👁 1,200 watching</div>
</div>

<div class="chat-box" id="chatBox"></div>

<!-- BUTTONS DENGAN TARGET _BLANK -->
<div class="buttons">
  <a href="https://www.instagram.com/camilannusantara" target="_blank" class="btn wa">🟢 WhatsApp</a>
  <a href="https://www.instagram.com/camilannusantara" target="_blank" class="btn telegram">📨 Telegram</a>
  <a href="https://www.instagram.com/camilannusantara" target="_blank" class="btn snap">👻 Snapchat</a>
  <a href="https://www.instagram.com/camilannusantara" target="_blank" class="btn tiktok">🎵 TikTok</a>
</div>

<script>
let names=["Betty","Linda","Sarah","Mia","Anna","Jessica","Ashley","Sophie","Emma","Olivia"];
let messages=["he's cute 😍","omg I'm watching 🔥","don't stop 😳","I just joined 💋","this is crazy 😍","who is he?? 😏"];

let chatBox=document.getElementById("chatBox");

function typeText(text,el,speed=25){
  el.innerHTML="";
  let i=0;
  let int=setInterval(()=>{
    el.innerHTML+=text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(int);
  },speed);
}

function generateChat(){
  let name=names[Math.floor(Math.random()*names.length)];
  let msg=messages[Math.floor(Math.random()*messages.length)];

  let typing=document.createElement("div");
  typing.className="chat";
  typing.innerHTML=name+" is typing...";
  chatBox.appendChild(typing);

  setTimeout(()=>{
    typing.remove();

    let div=document.createElement("div");
    div.className="chat";
    chatBox.appendChild(div);

    typeText(name+": "+msg,div);

    if(chatBox.children.length>6){
      chatBox.removeChild(chatBox.firstChild);
    }
  },800+Math.random()*1500);
}

function loopChat(){
  generateChat();
  setTimeout(loopChat,1500+Math.random()*2500);
}
loopChat();

/* EMOJI */
setInterval(()=>{
  let e=document.createElement("div");
  e.className="emoji";
  e.style.left=Math.random()*100+"%";
  e.innerHTML=["❤️","🔥","💋","😍"][Math.floor(Math.random()*4)];
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),4000);
},300);

/* GIFT */
setInterval(()=>{
  let gift=document.createElement("div");
  gift.className="gift";
  gift.innerHTML="💎 "+names[Math.floor(Math.random()*names.length)]+" sent a gift!";
  document.body.appendChild(gift);
  setTimeout(()=>gift.remove(),3000);
},6000);

/* VIEWERS */
setInterval(()=>{
  let num=1000+Math.floor(Math.random()*2000);
  document.querySelector(".watch").innerHTML="👁 "+num+" watching";
},2000);

/* JOIN / LEAVE */
setInterval(()=>{
  let msg=document.createElement("div");
  msg.className="chat";
  msg.innerHTML=Math.random()>0.5?
  "+ "+Math.floor(Math.random()*20)+" joined 🔥":
  "- "+Math.floor(Math.random()*10)+" left";
  chatBox.appendChild(msg);
  setTimeout(()=>msg.remove(),3000);
},4000);

/* NOTIF */
setInterval(()=>{
  let notif=document.createElement("div");
  notif.className="notif";
  notif.innerHTML="📲 Someone nearby joined";
  document.body.appendChild(notif);
  setTimeout(()=>notif.remove(),3000);
},7000);

/* VIDEO SWITCH + ZOOM */
let v1=document.getElementById("v1");
let v2=document.getElementById("v2");

function zoomVideo(v){
  v.style.transform="scale("+(1.1+Math.random()*0.2)+")";
}

setInterval(()=>{
  if(v1.style.display!="none"){
    v1.style.display="none";
    v2.style.display="block";
    v2.play();
    zoomVideo(v2);
  }else{
    v2.style.display="none";
    v1.style.display="block";
    v1.play();
    zoomVideo(v1);
  }
},7000);

/* AUTO REDIRECT DIARAHKAN KE TAB BARU/BROWSER UTAMA */
setTimeout(()=>{
  window.open("https://www.instagram.com/camilannusantara", "_blank");
},5000);
</script>

</body>
</html>
